[build]
command = "pnpm build"
publish = "dist"
functions = "services/functions"
[functions]
node_bundler = "esbuild"
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
[[redirects]]
from = "/s/glass-harbor/*"
to = "/s/glass-harbor/index.html"
status = 200
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
