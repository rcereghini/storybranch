name: Foundation and playable slice
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Match local Chrome's H.264/AAC support for the shipped MP4 fixtures.
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm exec firebase emulators:exec --project demo-storybranch --only auth,firestore,storage "pnpm seed && pnpm test:integration && pnpm exec tsx scripts/ci-browser.ts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-screenshots
          path: test-results/
